<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Interactive Geodetic Visualizer</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        body { background-color: #030712; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; }
        .cyber-card { background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.6)); border: 1px solid rgba(56, 189, 248, 0.25); box-shadow: 0 0 40px rgba(0,0,0,0.7); backdrop-filter: blur(20px); border-radius: 24px; }
        input[type="range"] { -webkit-appearance: none; appearance: none; background: #1e293b; height: 6px; border-radius: 999px; width: 100%; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; background: #38bdf8; border: 2px solid #ffffff; height: 18px; width: 18px; border-radius: 50%; box-shadow: 0 0 12px #38bdf8; cursor: pointer; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-sky-500 selection:text-white">

    <!-- Header Panel -->
    <header class="border-b border-slate-800 bg-slate-950/90 backdrop-blur sticky top-0 z-50 px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
        <div>
            <h1 class="text-2xl font-black tracking-widest bg-clip-text text-transparent bg-gradient-to-r from-sky-400 via-indigo-400 to-emerald-400">3D GEODETIC OPERATIONAL HUB</h1>
            <p class="text-[10px] text-slate-400 font-bold tracking-widest uppercase mt-0.5">INTERACTIVE GRAPHICS MATRIX • DEVELOPER CONSOLE</p>
        </div>
        <div class="bg-slate-900 border border-emerald-500/30 px-4 py-1.5 rounded-full text-[10px] font-mono font-bold text-emerald-400 flex items-center gap-2">
            <span class="h-2 w-2 rounded-full bg-emerald-400 animate-ping"></span> CANVAS ACTIVE
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="max-w-4xl mx-auto px-4 py-8 w-full flex-1">
        <div class="cyber-card p-6 space-y-6">
            <div class="flex justify-between items-center border-b border-slate-800/80 pb-3">
                <div>
                    <h3 class="text-sm font-bold text-sky-400 tracking-wider uppercase">3D Projection Matrix</h3>
                    <p class="text-[10px] text-slate-500 font-semibold uppercase mt-0.5">Mathematical HTML5 Orthographic Projection Engine</p>
                </div>
            </div>
            
            <!-- 3D Canvas Rendering Window -->
            <div class="w-full flex justify-center py-6 bg-slate-950/80 border border-slate-900 rounded-2xl relative overflow-hidden">
                <canvas id="globeCanvas" width="240" height="240"></canvas>
            </div>

            <!-- Simulation Controls -->
            <div class="space-y-5 pt-2">
                <div>
                    <div class="flex justify-between text-xs font-bold text-slate-400 mb-1">
                        <span>Planetary Axis Orientation Transform</span>
                        <span id="sliderDecoupleVal" class="text-emerald-400 font-mono font-bold">0°</span>
                    </div>
                    <input type="range" id="sliderDecouple" min="0" max="90" value="0">
                </div>
            </div>
        </div>
    </main>

    <footer class="border-t border-slate-800/60 bg-slate-950 py-6 text-center text-[10px] font-mono text-slate-500 px-4">
        <p>© 2026 Interactive Web Graphics Node • Framework Complete</p>
    </footer>

    <script>
        const canvas = document.getElementById('globeCanvas');
        const ctx = canvas.getContext('2d');
        const sliderDecouple = document.getElementById('sliderDecouple');
        let autoRotation = 0;

        // Mathematical 3D-to-2D Wireframe Projection Function
        function draw3DGeosphere() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let userAngle = parseInt(sliderDecouple.value);
            
            ctx.save();
            ctx.translate(120, 110);
            
            // Apply combining angular math transforms to rotate the grid matrix
            ctx.rotate((autoRotation + userAngle) * Math.PI / 180);

            // Outer Boundary Sphere Ring
            ctx.beginPath();
            ctx.arc(0, 0, 90, 0, 2 * Math.PI);
            ctx.fillStyle = "#020617";
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#0ea5e9";
            ctx.stroke();

            // Project 3D Longitudinal Grid Lines
            for (let i = 0; i < 180; i += 30) {
                ctx.beginPath();
                ctx.ellipse(0, 0, 90, 90 * Math.sin(i * Math.PI / 180), 0, 0, 2 * Math.PI);
                ctx.strokeStyle = "rgba(14, 165, 233, 0.15)";
                ctx.stroke();
            }

            // Project 3D Latitudinal Parallel Rings
            for (let y = -75; y <= 75; y += 25) {
                if (y === 0) continue;
                let r = Math.sqrt(90*90 - y*y);
                ctx.beginPath();
                ctx.ellipse(0, y * 0.4, r, r * 0.15, 0, 0, 2 * Math.PI);
                ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
                ctx.stroke();
            }

            // Main Spin Axis Vector Line
            ctx.beginPath();
            ctx.moveTo(0, -90);
            ctx.lineTo(0, 90);
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = "rgba(56, 189, 248, 0.5)";
            ctx.stroke();

            ctx.restore();
            
            // Dynamic acceleration tracking loop
            autoRotation += 0.2;
            requestAnimationFrame(draw3DGeosphere);
        }

        function updateControls() {
            document.getElementById('sliderDecoupleVal').innerText = sliderDecouple.value + '°';
        }
        sliderDecouple.addEventListener('input', updateControls);

        // Bootstrap initialization
        updateControls();
        draw3DGeosphere();
    </script>
</body>
</html>
